<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Ascensão dos Data Centers no Brasil</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh; max-height: 100vh; overflow: hidden;
      font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a;
    }
    h1, h2, h3, h4 { font-family: 'Outfit', sans-serif; }
    .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid #cbd5e1; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06); }
    .glass-glow { box-shadow: 0 8px 25px rgba(8, 145, 178, 0.15); border: 1px solid rgba(6, 182, 212, 0.4); }
    
    input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #0891b2; cursor: pointer; margin-top: -8px; box-shadow: 0 0 8px rgba(8, 145, 178, 0.5); }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #cbd5e1; border-radius: 2px; }

    .active-stage { animation: fadeIn 0.35s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="flex flex-col relative">

  <!-- HEADER -->
  <header class="h-16 bg-white/95 border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-50 absolute top-0 w-full shadow-sm">
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Logo Frei Seráfico" class="h-11 w-auto object-contain shrink-0">
      <div class="px-3 h-8 rounded-lg bg-cyan-600 flex items-center justify-center font-bold text-white text-sm whitespace-nowrap">7º ano EFII</div>
      <div class="flex flex-col justify-center">
        <h1 class="font-bold text-lg tracking-wide whitespace-nowrap text-slate-900 leading-tight">Frei Seráfico <span class="text-cyan-700 font-semibold">| Feira de Ciências 2026: DATACENTERS</span></h1>
        <span class="text-[11px] text-slate-500 mt-0.5 leading-none">Professores orientadores: Fernando (Informática) e Matheus (Matemática)</span>
      </div>
    </div>
